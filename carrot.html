<title>당근 영상 데일리 트래커</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#202938;--muted:#687386;--line:#e3e8f0;--blue:#315efb;--carrot:#f07832;--green:#16835f;--bad:#c24141}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{max-width:1400px;margin:auto;padding:20px 20px 48px}
.workspace-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 22px #1c273c08}.workspace-brand{font-size:12px;font-weight:900;letter-spacing:.05em;color:var(--muted);padding:0 8px}.workspace-links{display:flex;gap:7px;flex-wrap:wrap}.workspace-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-weight:800;background:#fff;font-size:13px}.workspace-link.active{background:var(--blue);border-color:var(--blue);color:#fff}
.top,.head,.chart-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.eyebrow{font-size:12px;color:var(--carrot);font-weight:900;letter-spacing:.1em}.top h1{margin:7px 0;font-size:clamp(25px,3vw,36px)}p{color:var(--muted)}.asof{margin:0 0 18px}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff;font-weight:800;cursor:pointer}.btn.primary{background:var(--carrot);border-color:var(--carrot);color:#fff}.btn:disabled{opacity:.55;cursor:wait}
.cheer{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#fff8e9 0%,#fff1f4 55%,#f0f4ff 100%);border:1px solid #f1dfd5;border-radius:15px;padding:18px 20px;margin:0 0 18px;box-shadow:0 7px 22px #1c273c0a}.cheer-emoji{font-size:28px}.cheer-label{font-size:12px;font-weight:850;color:#9a5d48;margin:0 0 6px}.cheer-text{font-size:clamp(15px,1.8vw,18px);line-height:1.65;font-weight:750;color:#3c3540;margin:0}.cheer-by,.cheer-data{font-size:12px;margin:7px 0 0;color:#857780}.banner{padding:12px 14px;background:#fff7e8;border:1px solid #f1dfbd;border-radius:10px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.kpi,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 7px 22px #1c273c0a}.name{font-size:13px;color:var(--muted)}.value{display:block;font-size:clamp(22px,2.5vw,30px);font-weight:850;margin:8px 0}.pill{display:inline-block;font-size:11px;font-weight:800;padding:5px 8px;border-radius:99px;background:#f0f3f9;color:var(--muted)}.pill.up{background:#e5f7ef;color:var(--green)}.pill.down{background:#fff0f0;color:var(--bad)}.sub{font-size:12px;color:var(--muted);display:block;margin-top:8px}.ratios{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}.ratios span{background:#eef2f8;padding:9px 12px;border-radius:9px;font-size:12px;color:var(--muted)}.ratios b{color:var(--ink);margin-left:6px}
.panel{padding:20px;margin-top:16px}.panel h2{margin:0;font-size:18px}.seg,.tabs{display:flex;gap:5px;background:#f0f3f9;padding:5px;border-radius:11px}.seg button,.tabs button{border:0;background:transparent;border-radius:8px;padding:9px 14px;font-weight:800;color:var(--muted);cursor:pointer}.seg button[aria-pressed=true],.tabs button[aria-pressed=true]{background:#fff;color:var(--carrot);box-shadow:0 1px 3px #1c273c12}.chart-head{margin-bottom:12px}.readout{margin:0 0 12px;font-size:13px}.chart-body{display:grid;grid-template-columns:45px 1fr;gap:8px;min-height:220px}.yax{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-size:11px;color:var(--muted);padding-bottom:24px}.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:5px;position:relative;min-width:0}.gridlines{position:absolute;inset:0 0 24px;pointer-events:none}.gridlines i{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}.col{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:0;background:transparent;min-width:0;padding:0 1px;cursor:pointer}.barbox{height:180px;width:100%;display:flex;align-items:flex-end;justify-content:center}.bar{display:block;width:min(75%,28px);min-height:0;background:#f4c2a1;border-radius:7px 7px 2px 2px}.col.cur .bar,.col[aria-pressed=true] .bar{background:var(--carrot)}.xl{font-size:10px;color:var(--muted);margin-top:8px;white-space:nowrap}.chart-foot,.note{font-size:12px;color:var(--muted);line-height:1.6}.entrygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:750}.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.form-note{font-size:12px;color:var(--muted);margin:12px 0 0}.form-note.warn{color:var(--bad)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;margin-top:15px}table{border-collapse:collapse;width:100%;min-width:790px;background:#fff}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}th{background:#f8f9fc;color:#657086;position:sticky;top:0;z-index:3}tr:last-child td{border-bottom:0}tr.cur{background:#fffaf6}.num{font-variant-numeric:tabular-nums}.cumn{display:block;font-size:10px;color:#9aa3b2;margin-top:5px}.tag{display:inline-block;margin-left:6px;font-size:10px;padding:4px 6px;border-radius:5px;background:#f0f3f9;color:var(--muted)}.rowbtn{border:0;background:none;padding:0;color:var(--blue);font-weight:750;cursor:pointer}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 16px;border-radius:10px;background:#202938;color:white;font-size:13px;box-shadow:0 8px 25px #0002}.hidden,[hidden]{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;margin:22px}
@media(max-width:850px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.entrygrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.app{padding:12px 10px 35px}.panel{padding:14px}.kpis{gap:8px}.kpi{padding:12px}.entrygrid{grid-template-columns:1fr 1fr}.workspace-nav{align-items:flex-start}.workspace-links{width:100%}.workspace-link{flex:1}.barbox{height:145px}.chart-body{grid-template-columns:34px 1fr}.xl{font-size:9px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><main class="app">
<nav class="workspace-nav" aria-label="콘텐츠 도구 이동"><div class="workspace-brand">MY CONTENT WORKSPACE</div><div class="workspace-links"><a class="workspace-link" href="./">콘텐츠 업로드 현황표</a><a class="workspace-link active" href="./carrot.html">당근 데일리 트래커</a></div></nav>
<header class="top"><div><div class="eyebrow">CARROT VIDEO ANALYTICS</div><h1>당근 영상 데일리 트래커</h1><p class="asof" id="asof"></p></div><div><button class="btn" id="logoutBtn">로그아웃</button></div></header>
<section class="cheer" aria-label="오늘의 응원 한마디"><div class="cheer-emoji" id="cheer-emoji">🌱</div><div class="cheer-body"><p class="cheer-label" id="cheer-label"></p><p class="cheer-text" id="cheer-text"></p><p class="cheer-by" id="cheer-by"></p><p class="cheer-data" id="cheer-data"></p></div></section>
<p class="banner" id="banner" hidden></p>
<section><p id="cmp-label" class="name"></p><div class="kpis" id="kpis"></div></section><p class="ratios" id="ratios"></p>
<section class="panel"><div class="chart-head"><h2 id="chart-title">추이 (월 누적)</h2><div class="seg" id="period" role="group" aria-label="보기 단위"><button data-mode="day" aria-pressed="true">일</button><button data-mode="week" aria-pressed="false">주</button><button data-mode="month" aria-pressed="false">월</button></div></div><div class="tabs" id="metric-tabs"></div><p class="readout" id="readout"></p><div class="chart-body" id="chart"></div><p class="chart-foot" id="chart-foot"></p></section>
<section class="panel"><h2 id="entry-title">오늘 기록하기</h2><form id="entry-form" autocomplete="off"><div class="entrygrid"><div class="field"><label for="f-date">날짜</label><input id="f-date" type="date" required></div><div class="field"><label for="f-uploads">업로드 수 (당월 누적)</label><input id="f-uploads" type="number" min="0" step="1" placeholder="0" required></div><div class="field"><label for="f-views">조회수 (당월 누적)</label><input id="f-views" type="number" min="0" step="1" placeholder="0" required></div><div class="field"><label for="f-valid">유효시청수 (당월 누적)</label><input id="f-valid" type="number" min="0" step="1" placeholder="0" required></div><div class="field"><label for="f-viewers">시청자 수 (당월 누적)</label><input id="f-viewers" type="number" min="0" step="1" placeholder="0" required></div><div class="actions"><button class="btn primary" id="f-save" type="submit">저장</button><button class="btn" id="f-del" type="button" hidden>삭제</button></div></div><p class="form-note" id="f-note"></p></form></section>
<section class="panel"><div class="head"><h2 id="table-title">기간별 기록 (증가량)</h2><button class="btn" id="exportBtn">CSV 내보내기</button></div><div class="table-wrap"><table id="table"></table></div><p class="note">매월 1일을 새 기준으로 삼아 해당 월의 누적 수치를 입력하세요. 이전 달 기록은 보관되며 월별 집계는 자동으로 분리됩니다.</p><p class="form-note" id="syncStatus">연결 확인 중</p></section><footer>당근 영상 데이터 기록 · 매월 1일부터 말일까지 누적 관리</footer></main><div class="toast" id="toast" hidden></div>
<script>
(function(){
const SUPABASE_URL='https://iakcbqsswmemuefsdmip.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_qqYNkHHPtkge4mDlVhcpeg_WBJQRFy-';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const weekStart=d=>addDays(d,-((d.getDay()+6)%7));
const WD=['일','월','화','수','목','금','토'];
const KEYS=['uploads','views','valid','viewers'];
const METRICS=[{k:'uploads',label:'업로드 수'},{k:'views',label:'조회수'},{k:'valid',label:'유효시청수'},{k:'viewers',label:'시청자 수'}];
const CHEERS=[['🌱','오늘도 기록을 남겼다면 어제보다 한 뼘 자란 거예요.'],['💧','작은 노력이 쌓이면 반드시 길이 보여요.'],['🔥','꾸준히 쌓는 오늘의 숫자가 내일의 성과가 돼요.'],['🍵','부업이 힘든 날엔 쉬어가도 괜찮아요. 숨 고르는 것도 과정이에요.'],['🌿','오늘 쌓은 숫자 하나가 내일의 큰 숫자가 돼요.'],['✨','배우고 기록하는 하루는 충분히 의미 있어요.'],['💪','속도가 느려도 꾸준히 가면 변화가 보여요.']];
let today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());
let ui={mode:'day',metric:'views'}, records={}, user=null, selected=null, storeReady=false;
const monthKey=d=>d.slice(0,7), n0=n=>Math.round(n||0).toLocaleString('ko-KR');
const compact=n=>n>=10000?(n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'만':n0(n);
const pct=(a,b)=>b>0?(a/b*100).toFixed(1)+'%':'—';
function toast(m){$('#toast').textContent=m;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2200)}
function note(m,w=false){$('#f-note').textContent=m||'';$('#f-note').className='form-note'+(w?' warn':'')}
function monthlyRecords(){return Object.keys(records).sort().filter(d=>monthKey(d)===monthKey(fmt(today)))}
function sorted(){return Object.keys(records).sort()}
function incFor(date){const prev=sorted().filter(d=>d<date&&monthKey(d)===monthKey(date)).pop();if(!prev)return null;const out={};KEYS.forEach(k=>out[k]=(records[date][k]||0)-(records[prev][k]||0));out.neg=KEYS.some(k=>out[k]<0);return out}
function totalPeriod(start,end){let t={uploads:0,views:0,valid:0,viewers:0,n:0,cum:null,base:false,neg:false};const s=fmt(start),e=fmt(end);sorted().forEach(d=>{if(d<s||d>e||monthKey(d)!==monthKey(e))return;t.cum=records[d];if(d>=s){const x=incFor(d);if(x){KEYS.forEach(k=>t[k]+=x[k]);t.n++;if(x.neg)t.neg=true}else t.base=true}});return t}
function periods(mode){const out=[];let i,s;if(mode==='day'){for(i=0;i<14;i++){s=addDays(today,i-13);out.push({start:s,end:s})}}else if(mode==='week'){const ws=weekStart(today);for(i=0;i<8;i++){s=addDays(ws,(i-7)*7);out.push({start:s,end:addDays(s,6)})}}else{for(i=0;i<6;i++){s=new Date(today.getFullYear(),today.getMonth()+(i-5),1);out.push({start:s,end:new Date(s.getFullYear(),s.getMonth()+1,0)})}}return out}
function longLabel(p,mode){const s=p.start,e=p.end;if(mode==='day')return(s.getMonth()+1)+'월 '+s.getDate()+'일 ('+WD[s.getDay()]+')';if(mode==='week')return(s.getMonth()+1)+'/'+s.getDate()+' ~ '+(e.getMonth()+1)+'/'+e.getDate()+' 주';return s.getFullYear()+'년 '+(s.getMonth()+1)+'월'}
function shortLabel(p,i,mode){if(mode==='day')return(i===0||p.start.getDate()===1)?(p.start.getMonth()+1)+'/'+p.start.getDate():String(p.start.getDate());if(mode==='week')return(p.start.getMonth()+1)+'/'+p.start.getDate();return(p.start.getMonth()+1)+'월'}
function niceMax(v){if(v<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=v)||10*p}
function render(){
 const date=fmt(today), ch=CHEERS[Math.floor(Date.UTC(today.getFullYear(),today.getMonth(),today.getDate())/864e5)%CHEERS.length];
 $('#asof').textContent=today.getFullYear()+'년 '+(today.getMonth()+1)+'월 '+today.getDate()+'일 '+WD[today.getDay()]+'요일 기준';
 $('#cheer-emoji').textContent=ch[0];$('#cheer-label').textContent='오늘의 응원 · '+(today.getMonth()+1)+'월 '+today.getDate()+'일';$('#cheer-text').textContent=ch[1];$('#cheer-by').textContent='';const last=monthlyRecords().filter(d=>incFor(d)).pop();const x=last?incFor(last):null;
 $('#cheer-data').textContent=x?'📈 '+last.slice(5)+' 기록에서 조회수 +'+n0(x.views)+' · 유효시청수 +'+n0(x.valid)+' 늘었어요. 꾸준히 쌓이고 있어요!':'📈 이번 달 첫 기록을 남기면 증가량을 함께 확인할 수 있어요.';
 const all=sorted();const thisMonth=monthlyRecords();const current=thisMonth.length?records[thisMonth[thisMonth.length-1]]:null;const previousMonth=all.filter(d=>monthKey(d)===monthKey(fmt(new Date(today.getFullYear(),today.getMonth()-1,1))));const prev=previousMonth.length?records[previousMonth[previousMonth.length-1]]:null;
 $('#banner').hidden=!!current;$('#banner').textContent='이번 달 기록이 아직 없어요. 이번 달 누적 숫자를 입력하면 1일부터 새로 집계돼요.';
 $('#cmp-label').textContent=(today.getMonth()+1)+'월 누적 현황 · 전월 말 누적과 비교';
 $('#kpis').innerHTML=METRICS.map(m=>{const v=current?current[m.k]:null;const pv=prev?prev[m.k]:null;const d=(v!==null&&pv>0)?(v-pv)/pv*100:null;const pill=v===null?'기록 없음':d===null?'전월 비교 불가':(d>=0?'▲ ':'▼ ')+Math.abs(d).toFixed(1)+'%';return '<div class="kpi"><span class="name">'+m.label+'</span><span class="value num">'+(v===null?'—':n0(v))+'</span><span class="pill '+(d===null?'':d>=0?'up':'down')+'">'+pill+'</span><span class="sub">'+(prev?'전월 말 '+n0(pv):'전월 비교 기록 없음')+'</span></div>'}).join('');
 $('#ratios').innerHTML=current?'<span>유효시청률<b>'+pct(current.valid,current.views)+'</b></span><span>시청자당 조회수<b>'+(current.viewers>0?(current.views/current.viewers).toFixed(2):'—')+'</b></span><span>업로드당 조회수<b>'+(current.uploads>0?n0(current.views/current.uploads):'—')+'</b></span>':'';
 document.querySelectorAll('#period button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===ui.mode)));
 const metric=METRICS.find(m=>m.k===ui.metric)||METRICS[1];$('#metric-tabs').innerHTML=METRICS.map(m=>'<button type="button" data-metric="'+m.k+'" aria-pressed="'+(m.k===metric.k)+'">'+m.label+'</button>').join('');
 const defs=periods(ui.mode);if(selected===null||selected>=defs.length)selected=defs.length-1;
 const vals=defs.map(p=>{const t=totalPeriod(p.start,p.end);return t.cum?t.cum[metric.k]:0});const max=niceMax(Math.max(...vals));
 const cols=defs.map((p,i)=>'<button type="button" class="col '+(i===defs.length-1?'cur':'')+'" data-i="'+i+'" aria-pressed="'+(i===selected)+'"><span class="barbox"><span class="bar" style="height:'+(vals[i]>0?Math.max(1.5,vals[i]/max*100):0)+'%"></span></span><span class="xl">'+shortLabel(p,i,ui.mode)+'</span></button>').join('');
 $('#chart').innerHTML='<div class="yax num"><span>'+compact(max)+'</span><span>'+compact(max/2)+'</span><span>0</span></div><div class="cols" style="--n:'+defs.length+'"><div class="gridlines"><i style="top:0"></i><i style="top:50%"></i><i style="top:100%"></i></div>'+cols+'</div>';
 const sp=defs[selected], ss=totalPeriod(sp.start,sp.end);$('#readout').innerHTML='<b>'+longLabel(sp,ui.mode)+'</b> · '+metric.label+' 누적 <b class="num">'+(ss.cum?n0(ss.cum[metric.k]):'기록 없음')+'</b>';
 $('#chart-foot').textContent=ui.mode==='day'?'최근 14일 · 매월 1일부터 월 누적을 새로 계산해요.':ui.mode==='week'?'최근 8주 · 월이 바뀌는 주는 각 월의 기록을 분리해 계산해요.':'최근 6개월 · 월별 누적은 매월 1일 기준으로 초기화돼요.';
 const rows=defs.map((p,i)=>({p,t:totalPeriod(p.start,p.end),cur:i===defs.length-1})).reverse();
 $('#table').innerHTML='<thead><tr><th>'+({day:'날짜',week:'주',month:'월'}[ui.mode])+'</th><th>업로드 수</th><th>조회수</th><th>유효시청수</th><th>시청자 수</th><th>유효시청률</th></tr></thead><tbody>'+rows.map(r=>{const lab='<button type="button" class="rowbtn" data-edit="'+fmt(r.p.start)+'">'+longLabel(r.p,ui.mode)+'</button>';if(!r.t.cum)return '<tr><td>'+lab+(r.cur?'<span class="tag">진행 중</span>':'')+'</td><td colspan="5">기록 없음</td></tr>';if(!r.t.n)return '<tr><td>'+lab+'<span class="tag">기준일</span></td><td colspan="5">월 누적 기준: 업로드 '+n0(r.t.cum.uploads)+' · 조회 '+n0(r.t.cum.views)+' · 유효시청 '+n0(r.t.cum.valid)+' · 시청자 '+n0(r.t.cum.viewers)+'</td></tr>';const cell=k=>'<td class="num">'+(r.t[k]>0?'+':'')+n0(r.t[k])+'<span class="cumn">누적 '+n0(r.t.cum[k])+'</span></td>';return '<tr class="'+(r.cur?'cur':'')+'"><td>'+lab+(r.cur?'<span class="tag">오늘</span>':'')+'</td>'+cell('uploads')+cell('views')+cell('valid')+cell('viewers')+'<td>'+pct(r.t.valid,r.t.views)+'</td></tr>'}).join('')+'</tbody>';
}
const F={date:$('#f-date'),uploads:$('#f-uploads'),views:$('#f-views'),valid:$('#f-valid'),viewers:$('#f-viewers')};
function fillForm(){const e=records[F.date.value];KEYS.forEach(k=>F[k].value=e?e[k]:'');$('#f-del').hidden=!e;$('#entry-title').textContent=F.date.value===fmt(today)?'오늘 기록하기':F.date.value+' 기록';note(e?'이 날짜의 기록을 수정할 수 있어요.':'해당 월의 누적 숫자를 입력하세요. 매월 1일에 누적을 0부터 다시 시작합니다.')}
function mapRow(r){return {date:r.record_date,uploads:r.uploads,views:r.views,valid:r.valid,viewers:r.viewers,updatedAt:r.updated_at}}
async function load(){const {data,error}=await sb.from('carrot_daily_metrics').select('*').order('record_date');if(error){$('#syncStatus').textContent='DB 연결 준비 필요: '+error.message;return}records={};(data||[]).forEach(r=>records[r.record_date]=mapRow(r));storeReady=true;$('#syncStatus').textContent='Supabase 동기화 완료';fillForm();render()}
$('#entry-form').addEventListener('submit',async ev=>{ev.preventDefault();if(!storeReady){note('데이터베이스 연결을 먼저 완료해야 저장할 수 있어요.',true);return}if(!F.date.value){note('날짜를 선택해 주세요.',true);return}const entry={date:F.date.value};KEYS.forEach(k=>{if(F[k].value.trim()===''){entry[k]=0}else entry[k]=Math.max(0,parseInt(F[k].value,10)||0)});if(Object.keys(records).some(d=>d<entry.date&&monthKey(d)===monthKey(entry.date)&&KEYS.some(k=>entry[k]<records[d][k]))){if(!confirm('이전 기록보다 작은 값이 있어요. 월 누적이 맞는지 확인했나요?'))return}
$('#f-save').disabled=true;const row={record_date:entry.date,uploads:entry.uploads,views:entry.views,valid:entry.valid,viewers:entry.viewers,updated_at:new Date().toISOString()};const {error}=await sb.from('carrot_daily_metrics').upsert(row,{onConflict:'record_date'});$('#f-save').disabled=false;if(error){note('저장 실패: '+error.message,true);return}records[entry.date]=entry;toast(entry.date+' 기록을 저장했어요');fillForm();render()});
$('#f-del').addEventListener('click',async()=>{const d=F.date.value;if(!records[d])return;if(!confirm(d+' 기록을 삭제할까요?'))return;const {error}=await sb.from('carrot_daily_metrics').delete().eq('record_date',d);if(error){note('삭제 실패: '+error.message,true);return}delete records[d];fillForm();render();toast('기록을 삭제했어요')});
$('#f-date').addEventListener('change',fillForm);$('#period').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ui.mode=b.dataset.mode;selected=null;render()});$('#metric-tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ui.metric=b.dataset.metric;render()});$('#chart').addEventListener('click',e=>{const b=e.target.closest('.col');if(!b)return;selected=Number(b.dataset.i);render()});$('#table').addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(!b)return;F.date.value=b.dataset.edit;fillForm();document.querySelector('.entrygrid').scrollIntoView({behavior:'smooth',block:'center'})});
$('#exportBtn').addEventListener('click',()=>{const rows=[['날짜','업로드 수','조회수','유효시청수','시청자 수'],...sorted().map(d=>[d,records[d].uploads,records[d].views,records[d].valid,records[d].viewers])];const csv='\\ufeff'+rows.map(r=>r.join(',')).join('\\r\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='carrot-daily-'+monthKey(fmt(today))+'.csv';a.click();URL.revokeObjectURL(a.href)});
$('#logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.href='./'});
sb.auth.onAuthStateChange((event,session)=>{user=session&&session.user;$('#logoutBtn').hidden=!user});
F.date.value=fmt(today);fillForm();sb.auth.getSession().then(({data})=>{user=data.session&&data.session.user;if(!user){$('#syncStatus').textContent='로그인이 필요해요. 콘텐츠 현황표에서 로그인한 뒤 이 페이지로 이동해 주세요.';$('#f-save').disabled=true;return}load()});
})();
</script></body></html>
